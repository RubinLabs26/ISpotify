name: Build Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "requirements.txt"
      - "packaging/ISpotify-windows-x86_64.spec"
      - "packaging/windows-installer.iss"
      - "packaging/windows-version.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --distpath dist/windows packaging/ISpotify-windows-x86_64.spec
      - name: Build installer
        run: iscc packaging/windows-installer.iss
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ISpotify-windows-x86_64
          path: |
            dist/windows/ISpotify-windows-x86_64.exe
            dist/installer/ISpotify-Setup-x86_64.exe
          if-no-files-found: error
          retention-days: 30
