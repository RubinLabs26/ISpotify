name: Build Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "requirements.txt"
      - "packaging/ISpotify-windows-x86_64.spec"
      - "packaging/windows-installer.iss"
      - "packaging/windows-version.txt"
      - "packaging/publish-github-release.sh"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "requirements.txt"
      - "packaging/ISpotify-windows-x86_64.spec"
      - "packaging/windows-installer.iss"
      - "packaging/windows-version.txt"
      - "packaging/publish-github-release.sh"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --distpath dist/windows packaging/ISpotify-windows-x86_64.spec
      - name: Build installer
        run: iscc packaging/windows-installer.iss
      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = Select-String -Path packaging/windows-installer.iss -Pattern '^#define AppVersion "([^"]+)"$'
          if (-not $installer -or $installer.Matches[0].Groups[1].Value -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match the Windows installer version"
          }
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            'dist/windows/ISpotify-windows-x86_64.exe',
            'dist/installer/ISpotify-Setup-x86_64.exe'
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name" | Set-Content -Encoding ascii -NoNewline "$file.sha256"
          }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/windows/ISpotify-windows-x86_64.exe* dist/release/
          Copy-Item dist/installer/ISpotify-Setup-x86_64.exe* dist/release/
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ISpotify-windows-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-windows-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ISpotify-windows-${{ github.sha }}
          path: release
      - name: Publish Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/publish-github-release.sh release
