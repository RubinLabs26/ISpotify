name: Build Linux client

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "requirements.txt"
      - "packaging/apt/**"
      - "packaging/arch/PKGBUILD"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "requirements.txt"
      - "packaging/apt/**"
      - "packaging/arch/PKGBUILD"
      - ".github/workflows/build-linux.yml"

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name ISpotify \
            --add-data "assets:assets" \
            --hidden-import PySide6.QtSvg \
            main.py
          install -Dm755 dist/ISpotify dist/release/ISpotify-linux-x86_64
          install -Dm644 assets/branding/ispotify-logo.png dist/release/ispotify-logo.png
      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Debian package and checksums
        run: |
          packaging/apt/build-deb.sh \
            "${{ steps.version.outputs.version }}" \
            dist/release/ISpotify-linux-x86_64 \
            dist/release/ispotify-logo.png \
            dist/release
          cd dist/release
          sha256sum ISpotify-linux-x86_64 > ISpotify-linux-x86_64.sha256
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ISpotify-linux-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ISpotify-linux-${{ github.sha }}
          path: release
      - name: Publish Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "iSpotify ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
