name: Build Linux client

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "vendor/discord_social_sdk/**"
      - "requirements.txt"
      - "packaging/apt/**"
      - "packaging/arch/PKGBUILD"
      - "packaging/publish-github-release.sh"
      - ".github/workflows/build-linux.yml"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "main.py"
      - "core/**"
      - "ui/**"
      - "assets/**"
      - "vendor/discord_social_sdk/**"
      - "requirements.txt"
      - "packaging/apt/**"
      - "packaging/arch/PKGBUILD"
      - "packaging/publish-github-release.sh"
      - ".github/workflows/build-linux.yml"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out private Discord SDK runtime
        uses: actions/checkout@v7
        with:
          repository: RubinLabs26/ISpotify-sdk
          token: ${{ secrets.DISCORD_SDK_REPO_TOKEN }}
          path: vendor/discord_social_sdk
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0 libxkbcommon0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Verify Discord Social SDK
        run: |
          python -c "from core.discord_social_sdk import DiscordSocialClient; c=DiscordSocialClient(lambda *a: None, lambda *a: None, lambda *a: None); c.close(); print('Discord Social SDK loaded')"
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name ISpotify \
            --add-data "assets:assets" \
            --add-data "vendor/discord_social_sdk/License-Notices.txt:discord_social_sdk" \
            --add-binary "vendor/discord_social_sdk/linux-x86_64/libdiscord_partner_sdk.so:discord_social_sdk" \
            --collect-submodules keyring.backends \
            --hidden-import PySide6.QtSvg \
            main.py
          install -Dm755 dist/ISpotify dist/release/ISpotify-linux-x86_64
          install -Dm644 assets/branding/ispotify-logo.png dist/release/ispotify-logo.png
      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Debian package and checksums
        run: |
          packaging/apt/build-deb.sh \
            "${{ steps.version.outputs.version }}" \
            dist/release/ISpotify-linux-x86_64 \
            dist/release/ispotify-logo.png \
            dist/release
          cd dist/release
          sha256sum ISpotify-linux-x86_64 > ISpotify-linux-x86_64.sha256
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: ISpotify-linux-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-linux-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ISpotify-linux-${{ github.sha }}
          path: release
      - name: Publish Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/publish-github-release.sh release
