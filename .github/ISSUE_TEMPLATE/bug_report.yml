name: Bug report
description: Report a reproducible problem in iSpotify
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove usernames, cookies, tokens, personal paths, and media history before posting.
  - type: input
    id: version
    attributes:
      label: iSpotify version
      placeholder: "17.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Windows 11, Debian 12, Arch Linux…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
